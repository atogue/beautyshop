services:
  mongodb:
    image: mongo:5.0
    restart: unless-stopped
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - "27017:27017"
    networks:
      - applications-network
    volumes:
      - ./data/mongodb:/etc/mongo
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongoexpress
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongo
      ME_CONFIG_MONGODB_AUTH_USERNAME: mongo
      ME_CONFIG_MONGODB_AUTH_PASSWORD: mongo
      ME_CONFIG_SITE_BASEURL: /
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - applications-network
  loki:
    image: grafana/loki:3.3.1
    container_name: loki
    restart: unless-stopped
    ports:
      - "29100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./data/loki:/loki
      - ./configurations/loki/local-config.yml:/loki/local-config.yml
    networks:
      - applications-network
  alloy:
    image: grafana/alloy:v1.6.1
    container_name: alloy
    restart: unless-stopped
    ports:
      - "29145:12345"
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./configurations/alloy/config.alloy:/etc/alloy/config.alloy
      - ./data/loki:/loki
      - ../logs:/tmp/logs
    networks:
      - applications-network
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "29000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana:/var/lib/grafana
    networks:
      - applications-network
  beauty-shop:
    image: beauty-shop:0.0.1
    container_name: beauty-shop
    depends_on:
      - mongodb
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=mongo
      - MONGO_PASSWORD=mongo
      - MONGO_AUTH_DB=admin
    networks:
      - applications-network
networks:
  applications-network:
    name: applications-network
    external: true